name: Build ScanLite APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip scanlite.zip
        run: |
          unzip -oq scanlite.zip
          test -f scanlite/pubspec.yaml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and configure manifest/SDK/ProGuard
        working-directory: scanlite
        run: |
          flutter create --platforms=android --org com.scanlite --project-name scanlite .
          rm -f test/widget_test.dart
          python3 -c '
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = re.sub(r"android:label=\"[^\"]+\"", "android:label=\"ScanLite\"", text, count=1)
          perms = ""
          if "android.permission.CAMERA" not in text:
              perms += "    <uses-permission android:name=\"android.permission.CAMERA\" />\n"
          if "android.permission.WRITE_EXTERNAL_STORAGE" not in text:
              perms += "    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />\n"
          if perms:
              text = text.replace("<application", perms + "    <application", 1)
          manifest.write_text(text)

          Path("android/app/proguard-rules.pro").write_text(
              "-dontwarn com.google.mlkit.vision.text.chinese.**\n"
              "-dontwarn com.google.mlkit.vision.text.devanagari.**\n"
              "-dontwarn com.google.mlkit.vision.text.japanese.**\n"
              "-dontwarn com.google.mlkit.vision.text.korean.**\n"
          )

          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              p = Path(name)
              if not p.exists():
                  continue
              g = p.read_text()
              g = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", g)
              g = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", g)
              g = re.sub(r"targetSdk\s*=\s*flutter\.targetSdkVersion", "targetSdk = 36", g)
              g = re.sub(r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 36", g)
              g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 21", g)
              g = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 21", g)
              g = g.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
              g = g.replace("JvmTarget.JVM_11", "JvmTarget.JVM_17")
              g = g.replace("jvmTarget = \"11\"", "jvmTarget = \"17\"")
              if "proguard-rules.pro" not in g:
                  if name.endswith(".kts"):
                      rule = "            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")\n"
                  else:
                      rule = "            proguardFiles getDefaultProguardFile(\x27proguard-android-optimize.txt\x27), \x27proguard-rules.pro\x27\n"
                  g = re.sub(r"(release\s*\{\s*\n)", r"\1" + rule, g, count=1)
              p.write_text(g)
          '

      - name: Get packages and analyze
        working-directory: scanlite
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: scanlite
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanlite-release-apk
          path: scanlite/build/app/outputs/flutter-apk/app-release.apk
